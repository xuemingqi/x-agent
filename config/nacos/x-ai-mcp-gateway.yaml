# X Agent: import into your project namespace, DEFAULT_GROUP.
# ${...} values are resolved from the service process environment.
---
server:
  port: "${X_AGENT_MCP_GATEWAY_PORT:18088}"
spring:
  threads:
    virtual:
      enabled: true
  ai:
    mcp:
      server:
        name: x-agent
        version: 0.1.0
        type: SYNC
        protocol: STREAMABLE
        instructions: 使用 run_agent 工具调用 X Agent，sessionId 为空时自动创建会话。
        request-timeout: 10m
        capabilities:
          tool: true
          resource: false
          prompt: false
          completion: false
        streamable-http:
          mcp-endpoint: "/mcp"
  cloud:
    openfeign:
      client:
        config:
          external-chat-api:
            connectTimeout: 5000
            readTimeout: 725000
id-worker:
  workerId: "${ID_WORKER_ID:1}"
  dataCenterId: 5
