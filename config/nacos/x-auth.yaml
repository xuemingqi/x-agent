# X Agent: import into your project namespace, DEFAULT_GROUP.
# ${...} values are resolved from the service process environment.
---
server:
  port: "${X_AGENT_AUTH_PORT:18082}"
  servlet:
    context-path: "/auth"
spring:
  threads:
    virtual:
      enabled: true
  redis:
    redisson:
      type: SINGLE
      single:
        address: "${REDIS_ADDRESS:redis://127.0.0.1:6379}"
        password: "${REDIS_PASSWORD:}"
        timeout: 3000
        connect-timeout: 3000
        connectionPoolSize: 20
        connectionMinimumIdleSize: 2
        idleConnectionTimeout: 10000
id-worker:
  workerId: "${ID_WORKER_ID:1}"
  dataCenterId: 1
jwt:
  sign: "${X_AGENT_JWT_SECRET}"
  iss: x-agent
  expiresTime: 30
login:
  failTimes: 5
  cycle: 5
  lockTime: 30
