# X Agent: import into your project namespace, DEFAULT_GROUP.
# ${...} values are resolved from the service process environment.
---
server:
  port: "${X_AGENT_CONTACT_PORT:18084}"
  servlet:
    context-path: "/contact"
spring:
  threads:
    virtual:
      enabled: true
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:x_agent}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: "${MYSQL_USERNAME}"
    password: "${MYSQL_PASSWORD}"
    hikari:
      pool-name: x-contact
      minimum-idle: 1
      maximum-pool-size: 10
      connection-timeout: 10000
id-worker:
  workerId: "${ID_WORKER_ID:1}"
  dataCenterId: 2
