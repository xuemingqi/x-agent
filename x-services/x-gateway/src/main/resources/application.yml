spring:
  application:
    name: x-gateway
  config:
    import:
      - nacos:x-agent-common.yaml?group=${NACOS_GROUP:DEFAULT_GROUP}
      - nacos:x-gateway.yaml?group=${NACOS_GROUP:DEFAULT_GROUP}
  cloud:
    nacos:
      config:
        server-addr: ${nacos.server-addr}
        namespace: ${nacos.namespace}
        group: ${nacos.group}
        file-extension: yaml
      discovery:
        server-addr: ${nacos.server-addr}
        namespace: ${nacos.namespace}
        group: ${nacos.group}
      username: ${nacos.username}
      password: ${nacos.password}

nacos:
  server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
  namespace: ${NACOS_NAMESPACE:x-agent-dev}
  group: ${NACOS_GROUP:DEFAULT_GROUP}
  username: ${NACOS_USERNAME:}
  password: ${NACOS_PASSWORD:}
