name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  configuration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Check generated configuration bundles
        run: |
          python3 scripts/build-init-sql.py
          git diff --exit-code -- config/sql/x-agent-init.sql
          python3 scripts/nacos.py package --output /tmp/x-agent-nacos.zip
          python3 - <<'PY'
          from zipfile import ZipFile
          with ZipFile('config/x-agent-nacos.zip') as committed, ZipFile('/tmp/x-agent-nacos.zip') as generated:
              assert sorted(committed.namelist()) == sorted(generated.namelist()), 'Nacos archive entries differ'
              for name in committed.namelist():
                  assert committed.read(name) == generated.read(name), f'Nacos archive is stale: {name}'
          PY
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn --batch-mode verify
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: x-webs/x-ai-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: x-webs/x-ai-web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
